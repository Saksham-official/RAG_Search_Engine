# Render Blueprint - Docker Deployment
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: rag-search-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    
    # Health check
    healthCheckPath: /
    
    # Environment variables
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
